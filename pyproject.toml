[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streammachine"
dynamic = ["version"]
description = "Async stream processing on Redis Streams: decorator-based agents, timers and shared state"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "trbck", email = "btorbicki@gmail.com"},
]
keywords = ["streaming", "redis", "redis-streams", "async", "asyncio", "event-driven", "data-processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]

dependencies = [
    "coredis>=4.22,<7",
    "venusian>=3.0",
    "pandas>=1.5",
    "uvloop>=0.17; sys_platform != 'win32'",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
dashboard = ["fastapi>=0.100", "uvicorn>=0.23"]
objstorage = ["redis>=4.5"]
cython = ["cython>=3.0"]
all = ["streammachine[mcp,dashboard,objstorage]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-benchmark>=4.0",
    "pytest-timeout>=2.2",
    "ruff>=0.4",
    "mypy>=1.8",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
streammachine-mcp = "streammachine.mcp_entry:main"

[project.urls]
Homepage = "https://github.com/trbck/streammachine"
Documentation = "https://github.com/trbck/streammachine/tree/master/docs"
Repository = "https://github.com/trbck/streammachine"
Issues = "https://github.com/trbck/streammachine/issues"
Changelog = "https://github.com/trbck/streammachine/blob/master/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "streammachine.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["streammachine*"]

[tool.setuptools.package-data]
streammachine = ["py.typed"]
"streammachine.cython" = ["*.pyx"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "C4"]
ignore = [
    "E501",  # line too long
    "B008",  # function call in default argument
    "E402",  # module level import not at top (optional imports after __version__)
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short --timeout=120"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests requiring Redis server",
]
filterwarnings = [
    "ignore::DeprecationWarning:coredis.*",
]

[tool.coverage.run]
source = ["streammachine"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
